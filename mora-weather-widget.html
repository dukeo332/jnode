<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mora Public Schools - Weather Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Zilla+Slab:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --mps-blue: #003DA5;
            --mps-gray: #A2AAAD;
            --mps-white: #FFFFFF;
            --mps-black: #2D2926;
            --shadow-blue: rgba(0, 61, 165, 0.15);
            --gradient-start: #003DA5;
            --gradient-end: #0052E6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .weather-container {
            background: var(--mps-white);
            border-radius: 20px;
            box-shadow: 
                0 20px 60px rgba(0, 61, 165, 0.1),
                0 8px 25px rgba(0, 61, 165, 0.05);
            overflow: hidden;
            width: 100%;
            max-width: 480px;
            position: relative;
            transform: translateY(0);
            transition: all 0.3s ease;
        }

        .weather-container:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 30px 80px rgba(0, 61, 165, 0.15),
                0 12px 35px rgba(0, 61, 165, 0.08);
        }

        .header {
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            padding: 25px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="20" cy="20" r="1" fill="rgba(255,255,255,0.05)"/><circle cx="80" cy="30" r="1.5" fill="rgba(255,255,255,0.08)"/><circle cx="30" cy="80" r="1" fill="rgba(255,255,255,0.05)"/></svg>');
            animation: drift 20s linear infinite;
            pointer-events: none;
        }

        @keyframes drift {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .school-title {
            font-family: 'Zilla Slab', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--mps-white);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            z-index: 2;
        }

        .tagline {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.9);
            font-style: italic;
            position: relative;
            z-index: 2;
        }

        .weather-content {
            padding: 30px 25px;
        }

        .location {
            text-align: center;
            margin-bottom: 25px;
        }

        .city-name {
            font-family: 'Zilla Slab', serif;
            font-size: 1.8rem;
            color: var(--mps-blue);
            font-weight: 700;
            margin-bottom: 5px;
        }

        .date-time {
            font-size: 0.9rem;
            color: var(--mps-gray);
            font-weight: 400;
        }

        .current-weather {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            border-radius: 15px;
            border: 2px solid rgba(0, 61, 165, 0.08);
        }

        .temperature {
            text-align: center;
        }

        .temp-value {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--mps-blue);
            line-height: 1;
            margin-bottom: 5px;
            position: relative;
        }

        .temp-value::after {
            content: '°F';
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--mps-gray);
            position: absolute;
            top: 0.2rem;
            margin-left: 2px;
        }

        .weather-icon {
            font-size: 4rem;
            filter: drop-shadow(0 4px 8px rgba(0, 61, 165, 0.15));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .weather-description {
            text-align: center;
        }

        .condition {
            font-family: 'Zilla Slab', serif;
            font-size: 1.2rem;
            color: var(--mps-blue);
            font-weight: 700;
            margin-bottom: 5px;
            text-transform: capitalize;
        }

        .feels-like {
            font-size: 0.85rem;
            color: var(--mps-gray);
            font-weight: 400;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .detail-item {
            background: rgba(0, 61, 165, 0.03);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(0, 61, 165, 0.08);
            transition: all 0.3s ease;
        }

        .detail-item:hover {
            background: rgba(0, 61, 165, 0.06);
            transform: translateY(-2px);
        }

        .detail-label {
            font-size: 0.75rem;
            color: var(--mps-gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .detail-value {
            font-size: 1.1rem;
            color: var(--mps-blue);
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--mps-gray);
            font-style: italic;
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #d32f2f;
            font-style: italic;
        }

        .update-time {
            text-align: center;
            font-size: 0.75rem;
            color: var(--mps-gray);
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(162, 170, 173, 0.2);
        }

        .mustang-accent {
            position: absolute;
            bottom: 10px;
            right: 15px;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--mps-blue), #0052E6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            opacity: 0.8;
            box-shadow: 0 4px 12px rgba(0, 61, 165, 0.2);
        }

        @media (max-width: 480px) {
            .weather-container {
                margin: 10px;
            }
            
            .current-weather {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 15px;
            }
            
            .weather-details {
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="weather-container">
        <div class="header">
            <h1 class="school-title">Mora Mustangs</h1>
            <p class="tagline">Exploring. Engaging. Empowering.</p>
        </div>
        
        <div class="weather-content">
            <div class="location">
                <h2 class="city-name">Mora, Minnesota</h2>
                <p class="date-time" id="currentDateTime"></p>
            </div>
            
            <div id="weatherData" class="loading">
                Loading current weather conditions...
            </div>
        </div>
        
        <div class="mustang-accent">M</div>
    </div>

    <script>
        // Weather API configuration
        const API_KEY = 'YOUR_API_KEY_HERE'; // You'll need to get a free API key from OpenWeatherMap
        const CITY = 'Mora';
        const STATE = 'MN';
        const COUNTRY = 'US';
        
        // Weather icon mapping
        const weatherIcons = {
            '01d': '☀️', '01n': '🌙',
            '02d': '⛅', '02n': '☁️',
            '03d': '☁️', '03n': '☁️',
            '04d': '☁️', '04n': '☁️',
            '09d': '🌧️', '09n': '🌧️',
            '10d': '🌦️', '10n': '🌧️',
            '11d': '⛈️', '11n': '⛈️',
            '13d': '❄️', '13n': '❄️',
            '50d': '🌫️', '50n': '🌫️'
        };

        // Update date and time
        function updateDateTime() {
            const now = new Date();
            const options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                timeZone: 'America/Chicago'
            };
            document.getElementById('currentDateTime').textContent = 
                now.toLocaleDateString('en-US', options);
        }

        // Fetch weather data (demo version with mock data)
        async function fetchWeatherData() {
            try {
                // For demo purposes, using mock data
                // In production, uncomment the API call below and add your API key
                
                /*
                const response = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?q=${CITY},${STATE},${COUNTRY}&appid=${API_KEY}&units=imperial`
                );
                const data = await response.json();
                */
                
                // Mock data for demo
                const data = {
                    name: "Mora",
                    main: {
                        temp: 28,
                        feels_like: 22,
                        humidity: 78,
                        pressure: 1013
                    },
                    weather: [{
                        main: "Snow",
                        description: "light snow",
                        icon: "13d"
                    }],
                    wind: {
                        speed: 8.5
                    },
                    visibility: 6000
                };
                
                displayWeatherData(data);
            } catch (error) {
                console.error('Error fetching weather data:', error);
                document.getElementById('weatherData').innerHTML = 
                    '<div class="error">Unable to load weather data. Please check your connection and try again.</div>';
            }
        }

        // Display weather data
        function displayWeatherData(data) {
            const icon = weatherIcons[data.weather[0].icon] || '🌤️';
            const temp = Math.round(data.main.temp);
            const feelsLike = Math.round(data.main.feels_like);
            const humidity = data.main.humidity;
            const windSpeed = Math.round(data.wind.speed);
            const visibility = Math.round(data.visibility / 1609.34 * 10) / 10; // Convert to miles
            
            const weatherHTML = `
                <div class="current-weather">
                    <div class="temperature">
                        <div class="temp-value">${temp}</div>
                    </div>
                    <div class="weather-icon">${icon}</div>
                    <div class="weather-description">
                        <div class="condition">${data.weather[0].description}</div>
                        <div class="feels-like">Feels like ${feelsLike}°F</div>
                    </div>
                </div>
                
                <div class="weather-details">
                    <div class="detail-item">
                        <div class="detail-label">Humidity</div>
                        <div class="detail-value">${humidity}%</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Wind</div>
                        <div class="detail-value">${windSpeed} mph</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Visibility</div>
                        <div class="detail-value">${visibility} mi</div>
                    </div>
                </div>
                
                <div class="update-time">
                    Last updated: ${new Date().toLocaleTimeString('en-US', {
                        hour: '2-digit',
                        minute: '2-digit',
                        timeZone: 'America/Chicago'
                    })}
                </div>
            `;
            
            document.getElementById('weatherData').innerHTML = weatherHTML;
        }

        // Initialize the widget
        function initWeatherWidget() {
            updateDateTime();
            fetchWeatherData();
            
            // Update time every minute
            setInterval(updateDateTime, 60000);
            
            // Update weather every 10 minutes
            setInterval(fetchWeatherData, 600000);
        }

        // Start the widget when page loads
        document.addEventListener('DOMContentLoaded', initWeatherWidget);
        
        // Add some interactive flair
        document.addEventListener('mousemove', (e) => {
            const container = document.querySelector('.weather-container');
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = (y - centerY) / 30;
            const rotateY = (centerX - x) / 30;
            
            container.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-5px)`;
        });
        
        document.addEventListener('mouseleave', () => {
            const container = document.querySelector('.weather-container');
            container.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)';
        });
    </script>
</body>
</html>
